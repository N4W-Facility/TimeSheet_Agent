# Ambiente de la app. TimeSheet_Agent.bat lo recrea automáticamente
# cuando este archivo cambia (compara su hash SHA256).
name: timesheet-agent
channels:
  - conda-forge
dependencies:
  # Versión fija y madura: los EDR corporativos bloquean python.exe recién publicados
  # (pasó con 3.11.17, compilado el mismo día). No usar la última sin probar.
  - python=3.11.13
  - pandas>=2.1,<3
  - numpy
  # BLAS OpenBLAS: el MKL de Intel (2026.x) tumba numpy en Windows (0xc06d007f, DLL diferida)
  - libblas=*=*openblas
  - openpyxl
  - requests
  - tzlocal
  - matplotlib-base     # gráficas dentro del chat
  - sel(win): pywin32
  - pytest
  - pip
  - pip:
      - playwright      # wheel con driver incluido (el paquete conda 'playwright' es solo Node)
      - customtkinter
      - ollama
      - mplcursors        # valores al pasar el mouse en las gráficas del chat
      - plotly            # gráfica interactiva en el navegador
